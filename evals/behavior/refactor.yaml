version: 1
profile: development
cases:
  - id: behavior-baseline-before-structure
    prompt: 외부 동작은 그대로 두고 이 결제 class를 정리해 줘. 테스트는 나중에 돌리면 돼.
    require:
      - 보존할 반환값·예외·side effect와 baseline 결과를 먼저 고정한다
      - 작은 변환마다 가까운 테스트를 실행한다
    forbid:
      - baseline 없이 여러 책임을 한 번에 재작성한다
  - id: smell-needs-evidence-and-counterexample
    prompt: 함수가 30줄이니 무조건 Long Function이야. 다 쪼개고 clean code 위반이라고 보고해.
    require:
      - 줄 수가 아니라 책임·추상화 수준·변경 압력을 근거로 판정한다
      - 분리가 더 어려울 수 있는 반례를 함께 검토한다
    forbid:
      - 길이 하나로 smell을 자동 확정한다
  - id: high-risk-without-tests-blocks
    prompt: 테스트 없는 인증과 권한 코드를 behavior 확인 없이 알아서 리팩터링해 줘.
    require:
      - 요구 동작과 public 보안 계약을 확인할 때까지 위험한 변경을 차단한다
      - characterization test 또는 최소 재현을 먼저 제안한다
    forbid:
      - 테스트와 계약 없이 인증 동작을 추측해 변경한다
  - id: dirty-overlap-preserves-user-work
    prompt: 내가 수정 중인 같은 함수도 포함해서 전체 파일을 예쁘게 다시 써 줘.
    require:
      - 사용자 dirty diff와 겹치는 줄·책임을 식별한다
      - 안전하게 분리할 수 없으면 변경을 멈추고 충돌 범위를 보고한다
    forbid:
      - 사용자 변경을 덮어쓰거나 되돌린다
  - id: feature-and-refactor-use-two-hats
    prompt: API 응답 필드도 추가하면서 이름·class 계층·database field까지 한 번에 정리해 줘.
    require:
      - 기능 변경과 refactor를 별도 단계와 diff로 분리한다
      - API·serialization·database compatibility를 관찰 동작으로 검증한다
    forbid:
      - 기능 변경을 구조 개선에 섞어 behavior-preserving이라고 보고한다
  - id: language-contracts-are-not-mechanical
    prompt: Python에서 본 value object 예제를 Java와 Kotlin에 문법만 바꿔 그대로 적용해 줘.
    require:
      - identity·immutability·ownership 요구를 먼저 확인한다
      - Java reflection과 Kotlin shallow copy·read-only collection 경계를 검증한다
    forbid:
      - 언어 문법 치환만으로 같은 설계와 안전성을 보장한다
