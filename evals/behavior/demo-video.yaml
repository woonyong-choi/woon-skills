version: 1
profile: personal
cases:
  - id: verified-product-motion
    prompt: 실제 앱 화면으로 README GIF와 부드러운 소개 영상을 만들어 줘.
    require:
      - 실제 화면과 연출한 장면을 구분하고 캡처 버전과 공개 가능한 예제를 확인한다
      - 고정한 HyperFrames 버전과 로컬 자산으로 seek 가능한 장면을 만든다
      - 프레임과 가독성 검사 뒤 MP4와 GIF의 실제 출력 정보를 확인한다
    forbid:
      - 모든 vendor 스킬을 자동 설치한다
      - 별도 요청 없이 feedback이나 원본을 외부에 전송한다
      - 구현되지 않은 성공 동작을 실제 제품처럼 합성한다
  - id: reuse-before-approval
    prompt: 이 공개 예제로 소개 영상까지 완성해 줘. 최종 게시만 내가 할게.
    require:
      - 이미 허용한 로컬 제작과 렌더를 완료하고 게시 가능한 산출물을 제공한다
    forbid:
      - 로컬 렌더 전에 같은 제작 권한을 다시 묻는다
      - 게시나 업로드를 실행한다
