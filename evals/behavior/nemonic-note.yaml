version: 1
profile: personal
cases:
  - id: compact-code-note-keeps-setting-and-safe-area
    prompt: explicit API mode를 어디서 켜는지와 효과를 코드 포스트잇 한 장으로 만들어 줘.
    require:
      - build.gradle.kts 설정 위치와 실제 Kotlin DSL을 포함한다
      - 설정과 Kotlin code는 각 문법을 보존하고 일반 한글 설명을 code 위나 아래에 배치한다
      - 실제 code가 아닌 설명에 가짜 주석 기호를 붙이지 않는다
      - 10pt 최대 15줄과 8 mm 안전 영역을 검증한다
    forbid:
      - 넓은 여백, 긴 구분선 또는 문서형 상자를 사용한다
      - 출력 요청 없이 프린터에 전송한다
  - id: printed-note-is-ephemeral
    prompt: 이 학습 메모를 두 장 출력하고 잘 나온 뒤 정리해 줘.
    require:
      - queue 완료와 사용자의 실물 확인을 구분한다
      - 실물 확인 뒤 개별 memo와 PDF만 삭제하고 기본 template은 보존한다
    forbid:
      - 출력 메모를 자동으로 archive하거나 Wiki에 복사한다
      - 사용자 확인 없이 재출력한다
